# Canonical 17-bin schema — Walters/N&J Factor Binning Sheet, verbatim.
#
# Bin names and definitions come directly from
# "WASH Dr_Walters Results/Factor Binning Sheet.docx.md" (Dr. Walters'
# document). The `examples` lists are his nuanced/verbatim factors.
# The `keywords` lists drive the same deterministic classifier used in
# stage 4 of the original pipeline (pta/scripts/stage4_classify.py),
# re-tuned so that every routing decision follows Dr. Walters' own
# Factor Binning List. Where his list routes a term differently from our
# 19-bucket schema, his routing wins. Key re-routes vs. pta/cross_case_factors.yaml:
#
#   spare parts, mechanics, technicians, operating costs -> O&M   (was Private Sector / Govt Finance)
#   NGOs                                                  -> Coordination (was Private Sector)
#   awareness, health, hygiene, education                 -> Community / Users (was Capacity Building / Hygiene bucket)
#   community participation / ownership                   -> Community Management (was Community and Users)
#   urbanization, town growth                             -> Planning (was Community and Users)
#   pollution, water resources                            -> Environmental (was Solid and Liquid Waste)
#   sanitation (service), water quality, water treatment  -> Service Performance
#   latrines, septic tanks, dumping sites, waste treatment-> Infrastructure
#   open defecation, improper/illegal dumping (behavior)  -> Community / Users
#   politics restored as its own bin                      (was merged into Govt Management)
#   national govt                                         -> Laws + Regulations (per binning list)
#   project implementation                                -> Infrastructure (was Planning)
#   transparency / financial accountability               -> Community Finance (was Monitoring)

